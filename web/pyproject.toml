[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kb-chatbot-web"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "gradio>=5.0.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
]

[tool.setuptools]
py-modules = ["api_client", "app"]
